<!--
Program 5:
    JSP Program to implement an online exam
-->

<!DOCTYPE html>
<html>
    <head>
        <title>Online Examination</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <form action="OnlineExamination.jsp" method="post">
            <center>
                <table border="1">
                    <tr><th colspan="2">Online Examination</th></tr>
                    <tr>
                        <td>User name:</td>
                        <td><input type="text" name="uname"></td>
                    </tr>
                    <tr>
                        <td colspan="2" align="center"><input type="submit" name="submit"
                            value="Start exam"></td>
                    </tr>
                </table>
            </center>
        </form>
    </body>
</html>
