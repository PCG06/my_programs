    HTML webpage to apply different styles to list using external CSS

<!DOCTYPE html>
<html>
<head>
    <title>Styled lists</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Styling list with color</h1>
    <div class="red">
        <ol>
            <li>Coffee</li>
            <li>Tea</li>
            <li>Coca Cola</li>
        </ol>
    </div>
    <div class="pink">
        <ol>
            <li>Coffee</li>
            <li>Tea</li>
            <li>Coca Cola</li>
        </ol>
    </div>
    <div class="blue">
        <ol>
            <li>Coffee</li>
            <li>Tea</li>
            <li>Coca Cola</li>
        </ol>
    </div>
</body>
</html>
