<!--
    Program 3:
    HTML webpage to create a student registration form using form input tags
-->

<!DOCTYPE html>
<html>
<head>
    <title>Student Registration Form</title>
    <style>
        form {
            display: grid;
            gap: 12px;
            grid-template-columns: 150px 250px;
            align-items: center;
            justify-content: center;
        }
        label {
            text-align: right;
        }
        .data {
            background-color: green;
            padding: 5px;
            color: white;
            font-weight: bold;
        }
        .btn {
            display: grid;
            grid-template-columns: 1fr 1fr;
            width: 250px;
        }
        .left {
            text-align: left;
        }
        .right {
            text-align: right;
        }
    </style>
</head>
<body>
    <h1>Student Registration</h1>
    <h3><p align="right">
        Location: Place<br>
        2023-02-25
    </p></h3>
    <p class="data">
        Student Data
    </p>

    <form>
        <label>Name:</label>
        <input type="text" name="fname">

        <label>Surname:</label>
        <input type="text" name="sname">

        <label>Date of Birth:</label>
        <input type="date" name="dob">

        <label>Sex:</label>
        <div>
            <input type="radio" name="sex" value="male"> Male
            <input type="radio" name="sex" value="female"> Female
        </div>

        <label>Phone:</label>
        <input type="number" name="phone">

        <label>Address:</label>
        <textarea name="address" rows="4" cols="40"></textarea>

        <label>Email:</label>
        <input type="email" name="email">

        <label>10<sup>th</sup> marks card:</label>
        <input type="file" name="marks10">

        <label>12<sup>th</sup> marks card:</label>
        <input type="file" name="marks12">

        <label>Course:</label>
        <select name="course">
            <option value="bca">BCA</option>
            <option value="bcom">BCom</option>
            <option value="bba">BBA</option>
            <option value="bsc">BSc</option>
        </select>

        <label></label>
        <div>
            <input type="checkbox" name="agree">
            I agree to <a href="https://github.com" target="_blank">Terms and Conditions</a>
        </div>

        <label></label>
        <div class="btn">
            <div class="left">
                <input type="reset" value="Reset" style="margin-right:10px;">
            </div>
            <div class="right">
                <input type="submit" value="Submit">
            </div>
        </div>
    </form>
</body>
</html>
