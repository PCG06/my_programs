name: Compile Java code

on:
  push:
    branches:
        - sem_5

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Install Apache Derby
      run: |
        curl -L -o /tmp/derby.tar.gz https://archive.apache.org/dist/db/derby/db-derby-10.17.1.0/db-derby-10.17.1.0-bin.tar.gz
        tar xzf /tmp/derby.tar.gz -C /tmp
        mv /tmp/db-derby-10.17.1.0-bin $HOME/derby
        echo "$HOME/derby/bin" >> $GITHUB_PATH

    - name: Install javax.servlet API
      run: |
        mkdir -p $HOME/servlet/lib
        curl -L -o $HOME/servlet/lib/javax.servlet-api-4.0.1.jar \
          https://repo1.maven.org/maven2/javax/servlet/javax.servlet-api/4.0.1/javax.servlet-api-4.0.1.jar

    - name: Compile All Java Files
      run: make -j$(nproc)

    # Success notification step
    - name: Send success notification to Discord
      if: success()
      shell: bash
      run: |
        COMMIT_HASH="${GITHUB_SHA:0:6}"
        curl -H "Content-Type: application/json" \
             -X POST \
             -d "{
               \"embeds\": [{
                 \"title\": \"Java: CI job succeeded on branch: ${{ github.ref_name }}\",
                 \"color\": 65280,
                 \"fields\": [
                   {
                     \"name\": \"Commit:\",
                     \"value\": \"[\`$COMMIT_HASH\`](<${{ github.event.head_commit.url }}>)\",
                     \"inline\": false
                   },
                   {
                     \"name\": \"Committed by:\",
                     \"value\": \"[${{ github.actor }}](https://github.com/${{ github.actor }})\",
                     \"inline\": false
                   }
                 ]
               }]
             }" \
             ${{ secrets.DISCORD_WEBHOOK_4 }}

    # Failure notification step
    - name: Send failure notification to Discord
      if: failure()
      shell: bash
      run: |
        COMMIT_HASH="${GITHUB_SHA:0:7}"
        curl -H "Content-Type: application/json" \
             -X POST \
             -d "{
               \"embeds\": [{
                 \"title\": \"Java: CI job failed on branch: ${{ github.ref_name }}\",
                 \"color\": 16711680,
                 \"fields\": [
                   {
                     \"name\": \"Commit:\",
                     \"value\": \"[\`$COMMIT_HASH\`](<${{ github.event.head_commit.url }}>)\",
                     \"inline\": false
                   },
                   {
                     \"name\": \"Committed by:\",
                     \"value\": \"[${{ github.actor }}](https://github.com/${{ github.actor }})\",
                     \"inline\": false
                   }
                 ]
               }]
             }" \
             ${{ secrets.DISCORD_WEBHOOK_4 }}
